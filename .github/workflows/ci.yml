name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25.x" }
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node-version: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node-version }}" }
      - uses: ./.github/actions/npm-candidate
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Select the repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --version
  native-candidate:
    name: Native candidate (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: harness-lens
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: harness-lens
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: harness-lens.exe
            archive: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: harness-lens
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read source version
        id: package
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-candidate
        with:
          version: ${{ steps.package.outputs.version }}
          target: ${{ matrix.target }}
          executable: ${{ matrix.executable }}
          archive: ${{ matrix.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/harness-lens-v${{ steps.package.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned scanner image
        run: docker build --file Containerfile --tag harness-lens-cli:test .
      - name: Verify non-root runtime and CLI version
        run: |
          test "$(docker run --rm --entrypoint id harness-lens-cli:test -u)" = "65532"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          test "$(docker run --rm harness-lens-cli:test --version)" = "harness-lens ${version}"
  language-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Test Go placeholder
        working-directory: placeholders/go
        run: go test ./...
      - name: Configure C and C++ placeholder
        run: cmake -S placeholders/cpp -B build/placeholders/cpp -DBUILD_TESTING=ON
      - name: Build C and C++ placeholder
        run: cmake --build build/placeholders/cpp
      - name: Test C and C++ placeholder
        run: ctest --test-dir build/placeholders/cpp --output-on-failure

  homebrew-formula:
    name: Homebrew formula (${{ matrix.arch }})
    needs: native-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out the PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: true
          cask: false
          stable: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download qualified native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Generate formula from candidate checksums
        run: |
          node scripts/generate-checksums.mjs dist dist/SHA256SUMS
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          node scripts/generate-distribution-packages.mjs "$version" dist/SHA256SUMS dist/generated
      - name: Parse, style, and strictly audit the generated formula
        env:
          TAP: harness-lens/validation
        run: |
          brew tap-new --no-git "$TAP"
          cp dist/generated/homebrew/Formula/harness-lens.rb "$(brew --repository "$TAP")/Formula/harness-lens.rb"
          brew trust --formula "$TAP/harness-lens"
          brew readall --os=all --arch=all "$TAP"
          brew style "$TAP/harness-lens"
          brew audit --strict "$TAP/harness-lens"
      - name: Install and exercise the candidate through Homebrew
        env:
          TAP: harness-lens/validation
          HOMEBREW_CACHE: ${{ runner.temp }}/harness-lens-homebrew-cache
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          node scripts/smoke-homebrew-package.mjs "$TAP/harness-lens" dist "$version"
