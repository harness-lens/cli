name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node-version: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.node-version }}" }
      - name: Bootstrap unpublished core
        run: |
          git clone --depth 1 https://github.com/harness-lens/core.git ../harness-lens-core
          npm --prefix ../harness-lens-core install
          npm --prefix ../harness-lens-core pack --pack-destination "$GITHUB_WORKSPACE"
          npm install --no-save "$GITHUB_WORKSPACE/harness-lens-core-0.0.1.tgz"
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  language-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: "1.22.x" }
      - name: Test Go placeholder
        working-directory: placeholders/go
        run: go test ./...
      - name: Configure C and C++ placeholder
        run: cmake -S placeholders/cpp -B build/placeholders/cpp -DBUILD_TESTING=ON
      - name: Build C and C++ placeholder
        run: cmake --build build/placeholders/cpp
      - name: Test C and C++ placeholder
        run: ctest --test-dir build/placeholders/cpp --output-on-failure
