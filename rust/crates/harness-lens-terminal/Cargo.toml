[package]
name = "harness-lens-terminal"
description = "Reusable deterministic terminal rendering for Harness Lens reports"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Cristian Camargo Filho <ccf@cdone.com.br>"]
license = "MPL-2.0"
repository = "https://github.com/harness-lens/cli"
homepage = "https://github.com/harness-lens/cli"
readme = "README.md"
keywords = ["harness", "agents", "terminal", "reports"]
publish = true

[dependencies]
harness-lens-core = { version = "0.0.2", git = "https://github.com/harness-lens/core.git", rev = "2a8e916fcf73cbeb1792358b5726e23472792721" }
serde_json = "1.0"

[dev-dependencies]
harness-lens = { version = "0.0.2", git = "https://github.com/harness-lens/sdk.git", rev = "c11b8683e9c021ee8bc8befb94623ce825146f4b" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
